services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: shiply
      POSTGRES_PASSWORD: shiply
      POSTGRES_DB: shiply
    ports: ['5433:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ['6380:6379']
volumes:
  pgdata: {}
