[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engine"
version = "0.1.0"
description = "Multi tenant Shopify + Meta ads analytics engine"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3",
  "pandas",
  "numpy",
  "scipy",
  "requests",
  "typer",
  "fastapi",
  "uvicorn",
  "jinja2",
  "python-multipart",
]

[project.scripts]
engine = "engine.cli:app"

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
engine = ["migrations/*.sql", "ui/templates/*.html", "ui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
