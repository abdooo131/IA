services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: shiply
      POSTGRES_PASSWORD: shiply
      POSTGRES_DB: shiplynow
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/20-shiplynow.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shiply -d shiplynow']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
