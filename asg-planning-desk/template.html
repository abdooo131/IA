<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ASG Planning Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a plant planner's desk. Filters scope everything; summary tiles open the list behind them; any SKU opens a side drawer. */
:root{
  color-scheme:light;
  --bg:#f2f3f5; --panel:#ffffff; --sunk:#f7f8f9; --ink:#15181d; --muted:#5b626d; --faint:#8a919b; --line:#dde0e5;
  --accent:#8f620c; --accent-ink:#ffffff; --accent-soft:#f6ecd8;
  --s1:#2a78d6; --s2:#eb6834; --band:#cde2fb; --cap:#15181d;
  --good:#1f7a4d; --good-bg:#e4f2ea; --warn:#9a5c00; --warn-bg:#fbefd9; --bad:#b3261e; --bad-bg:#fbe5e3; --info:#3d4f66; --info-bg:#e7ecf2;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0f1216; --panel:#171b21; --sunk:#1c2128; --ink:#eceef2; --muted:#a2a9b4; --faint:#7a828d; --line:#2a3038;
  --accent:#dcaa4a; --accent-ink:#1a1407; --accent-soft:#2e2512;
  --s1:#3987e5; --s2:#d95926; --band:#1c3657; --cap:#eceef2;
  --good:#5cc08c; --good-bg:#15301f; --warn:#e3a640; --warn-bg:#33270f; --bad:#f07a70; --bad-bg:#3a1a18; --info:#a9bbd2; --info-bg:#1e2733}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1216; --panel:#171b21; --sunk:#1c2128; --ink:#eceef2; --muted:#a2a9b4; --faint:#7a828d; --line:#2a3038;
  --accent:#dcaa4a; --accent-ink:#1a1407; --accent-soft:#2e2512;
  --s1:#3987e5; --s2:#d95926; --band:#1c3657; --cap:#eceef2;
  --good:#5cc08c; --good-bg:#15301f; --warn:#e3a640; --warn-bg:#33270f; --bad:#f07a70; --bad-bg:#3a1a18; --info:#a9bbd2; --info-bg:#1e2733}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--body)}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:18px 56px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px}
.brand{display:flex;flex-direction:column;gap:2px}
.eyebrow{font:600 12px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{font:700 34px/1 var(--display);letter-spacing:.01em;margin:0;text-wrap:balance}
h2{font:600 21px/1.15 var(--display);letter-spacing:.01em;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;max-width:70ch}
.badge{border:0;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--warn);background:var(--warn-bg);border-radius:999px;padding:3px 10px}

.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);margin-top:16px;padding-block:10px;border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.filters label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
select,input[type=search],input[type=number]{font:14px var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 9px;max-width:100%}
input[type=search]{width:min(260px,100%)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500;font-size:13.5px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:4px 9px;font-size:12.5px}
.scope{font-size:12.5px;color:var(--muted);margin-left:auto;align-self:center}
.scope b{color:var(--ink);font-weight:600}

nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:12px;border-bottom:1px solid var(--line)}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs .count{font:500 11.5px var(--mono);background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:0 6px;margin-left:6px;color:var(--muted)}
main{margin-top:18px;display:grid;gap:16px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;margin-bottom:10px}
.note{color:var(--muted);font-size:12.5px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}

.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.tile{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;cursor:pointer;display:flex;flex-direction:column;gap:4px;transition:border-color .12s,transform .12s}
.tile:hover{border-color:var(--accent)}
.tile .v{font:600 30px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.tile .l{font-size:12.5px;color:var(--muted)}
.tile .go{font-size:12px;color:var(--accent);font-weight:600;margin-top:4px}
.tile.alert .v{color:var(--bad)}
.tile.warn .v{color:var(--warn)}

.tblwrap{overflow-x:auto;margin-inline:-4px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:600;font-size:11.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding:7px 8px;white-space:nowrap;background:var(--panel)}
th.sort,th.msort{cursor:pointer;user-select:none}
th.sort:hover,th.msort:hover{color:var(--ink)}
th .arr{font-size:10px;margin-left:3px;color:var(--accent)}
td{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:middle}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.sku{font-family:var(--mono);font-size:12px;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunk)}
.prod{max-width:330px}
.prod small{display:block;color:var(--muted);font-size:12px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-good{background:var(--good-bg);color:var(--good)} .p-warn{background:var(--warn-bg);color:var(--warn)} .p-bad{background:var(--bad-bg);color:var(--bad)} .p-info{background:var(--info-bg);color:var(--info)}

.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font:11px var(--body)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted);margin-top:8px}
.key{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:6px;border-radius:1px}
.key.box{height:10px;border-radius:2px}
.key.dash{background:repeating-linear-gradient(90deg,var(--s1) 0 4px,transparent 4px 7px)!important}

.bars{display:grid;gap:4px}
.barrow{display:grid;grid-template-columns:minmax(120px,190px) 1fr auto;gap:10px;align-items:center;padding:5px 6px;border-radius:6px;cursor:pointer;border:0;background:none;text-align:left;width:100%}
.barrow:hover,.barrow.on{background:var(--sunk)}
.barrow.on .bl{color:var(--accent);font-weight:600}
.bl{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{position:relative;height:14px}
.fill{position:absolute;inset:0 auto 0 0;background:var(--s1);border-radius:0 4px 4px 0}
.fill.over{background:var(--bad)}
.capmark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--cap)}
.bv{font:500 12.5px var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}

.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:12px 14px}
.kv div{min-width:0}
.kv span{display:block;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
.kv b{font:500 15px var(--mono);font-variant-numeric:tabular-nums}
.reason{font-size:13px;background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:10px 12px;line-height:1.55}

.src-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;margin-bottom:8px}
.load{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);min-width:min(100%,320px)}
.load .track{flex:1;min-width:120px;background:var(--sunk);border:1px solid var(--line);border-radius:4px;overflow:hidden}
input.qty{width:96px;text-align:right;font-family:var(--mono);padding:5px 7px}
input.qty.changed{border-color:var(--accent);background:var(--accent-soft)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .15s;pointer-events:none;z-index:30}
.toast.show{opacity:1}

.tip{position:fixed;pointer-events:none;background:var(--panel);color:var(--ink);border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.14);font-size:12px;padding:8px 10px;border-radius:6px;opacity:0;z-index:40;min-width:150px}
.tip .t{color:var(--muted);margin-bottom:4px}
.tip .r{display:flex;align-items:center;justify-content:space-between;gap:14px}
.tip .r b{font:500 12.5px var(--mono)}

.scrim{position:fixed;inset:0;background:rgba(10,12,15,.4);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:21;overflow-y:auto;
  padding:calc(18px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.drawer-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.drawer h2{font-size:24px}
.close{border:1px solid var(--line);background:var(--panel);border-radius:6px;width:34px;height:34px;cursor:pointer;font-size:18px;line-height:1;flex:none}
.plancard{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--accent-soft);border-radius:6px;padding:10px 12px}
.plancard label{font-size:12.5px;color:var(--ink);font-weight:600}
.empty{color:var(--muted);font-size:13px;padding:12px 4px}
.badge.mine{color:var(--good);background:var(--good-bg)}
.slots{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr))}
.slot{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--panel);min-width:0}
.slot.ok{border-color:var(--good)}
.slot.bad{border-color:var(--bad)}
.slot h3{font:600 18px/1.1 var(--display);margin:0;display:flex;gap:8px;align-items:center;justify-content:space-between}
.cols{font:12px/1.5 var(--mono);color:var(--muted);overflow-wrap:anywhere}
.cols b{color:var(--ink);font-weight:500}
.drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1.5px dashed var(--line);border-radius:6px;padding:14px;text-align:center;cursor:pointer;color:var(--muted);font-size:13px;background:var(--sunk)}
.drop:hover,.drop.over{border-color:var(--accent);color:var(--ink)}
.drop strong{color:var(--accent);font-weight:600}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.drop:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.fstat{font-size:12.5px}
.fstat.ok{color:var(--good)} .fstat.bad{color:var(--bad)}
.problems{margin:0;padding-left:18px;color:var(--bad);font-size:13px}
.problems li.warn{color:var(--warn)}
.steps{margin:0;padding-left:20px;font-size:13.5px;display:grid;gap:4px;max-width:80ch}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg-label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.notes{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.notes li{display:grid;grid-template-columns:150px 1fr;gap:10px;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--sunk)}
.notes li b{font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--accent)}
tr.grp td{background:var(--sunk);font-weight:600}
tr.grp td:first-child{cursor:pointer}
tr.sub td{font-size:12.5px;color:var(--muted)}
th.mon{cursor:pointer}
th.mon:hover{color:var(--ink)}
th.wkcol,td.wkcol{background:var(--accent-soft)}
.caret{display:inline-block;width:12px;color:var(--accent)}
.mini{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.mini .chart text{font-size:10px}
.loadgrid{display:grid;grid-template-columns:minmax(120px,200px) repeat(6,1fr);gap:4px 6px;align-items:center;font-size:12.5px}
.loadgrid .cell{height:26px;border-radius:4px;background:var(--sunk);position:relative;overflow:hidden;border:1px solid var(--line)}
.loadgrid .cell i{position:absolute;left:0;bottom:0;top:0;background:var(--s1)}
.loadgrid .cell i.over{background:var(--bad)}
.loadgrid .cell span{position:relative;font:500 11.5px/26px var(--mono);padding-left:6px}
.loadgrid .h{font-size:11.5px;color:var(--muted);text-align:center}
.merch th:first-child,.merch td:first-child{position:sticky;left:0;z-index:1;background:var(--panel);min-width:230px;max-width:300px}
.merch tr.grp td:first-child{background:var(--sunk)}
.merch td.tcol,.merch th.tcol{border-left:2px solid var(--line)}
.merch tr.click-dept{cursor:pointer}
.merch tr.click-dept:hover td,.merch tr.click-dept.on td{background:var(--accent-soft)}
.merch td{white-space:nowrap}
.merch td,.merch th{padding-inline:6px}
.legend-inline{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:720px){.filters{position:static}.notes li{grid-template-columns:1fr}}
@media (max-width:560px){h1{font-size:28px}.tiles{grid-template-columns:1fr 1fr}.tile .v{font-size:24px}.scope{margin-left:0;width:100%}.barrow{grid-template-columns:110px 1fr auto}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="eyebrow">Ahram Security Group</span>
      <h1>ASG Planning Desk</h1>
      <div class="sub">Demand forecast and production plan for Ahram, AFM and Sicuro lines. Data as of <span id="asof"></span>. Forecast is monthly and splits into weeks; it accounts for price changes, promotions, holidays, construction activity, dealer stock, channels and stockouts.</div>
    </div>
    <button class="badge" id="srcBadge" type="button" title="Where these numbers come from">Synthetic demo data, not real ASG sales</button>
  </header>

  <div class="filters" role="search">
    <div class="seg-label">View by<div class="seg" role="group" aria-label="View by"><button type="button" data-per="month" aria-pressed="true">Month</button><button type="button" data-per="week" aria-pressed="false">Week</button></div></div>
    <label for="fLine">Product line<select id="fLine"></select></label>
    <label for="fSrc">Made at<select id="fSrc"></select></label>
    <label for="fFin">Finish<select id="fFin"></select></label>
    <label for="fQ">Search<input id="fQ" type="search" placeholder="SKU, model or name"></label>
    <button class="btn" id="fReset" type="button">Clear filters</button>
    <div class="scope" id="scope"></div>
  </div>

  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="view"></main>
</div>
<div class="tip" id="tip"></div>
<div class="toast" id="toast" role="status"></div>
<div id="drawerRoot"></div>

<script id="data" type="application/json">__DATA__</script>
<script>/*__ENGINE__*/</script>
<script>
let D, byId, INFO;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = (x, d = 0) => x == null || isNaN(x) ? '–' : Number(x).toLocaleString('en', {minimumFractionDigits:d, maximumFractionDigits:d});
const big = x => { if (x == null) return '–'; const a = Math.abs(x);
  return a >= 1e6 ? nf(x / 1e6, a >= 1e7 ? 1 : 2) + 'M' : a >= 1e4 ? nf(x / 1e3, 0) + 'k' : nf(x); };
const pct = (x, d = 0) => x == null ? '–' : (x > 0 ? '+' : '') + nf(x * 100, d) + '%';
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dlabel = (iso, yr = true) => { const [y, m, d] = iso.split('-').map(Number); return `${d} ${MON[m-1]}${yr ? ' ' + String(y).slice(2) : ''}`; };
const mlabel = (m, yr = true) => { const [y, mo] = m.split('-').map(Number); return `${MON[mo-1]}${yr ? ' ' + String(y).slice(2) : ''}`; };
const sumA = a => a.reduce((x, y) => x + y, 0);
function sum(arr, f){ let t = 0; for (const x of arr) t += f(x) || 0; return t; }
const addDays = (s, n) => ENGINE.addDays(s, n);

/* ---------- per viewer plan edits, kept in this browser only ---------- */
const KEY = 'asg-plan-v2';
let edits = {};
try { edits = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { edits = {}; }
const saveEdits = () => { try { localStorage.setItem(KEY, JSON.stringify(edits)); } catch (e) {} };
const planQty = s => edits[s.sku]?.q ?? s.q;
const approved = s => !!edits[s.sku]?.ok;
const setEdit = (s, patch) => { const e = {...edits[s.sku], ...patch}; if (e.q === s.q) delete e.q; edits[s.sku] = e; saveEdits(); };

/* ---------- filters and period ---------- */
const F = {line:'', src:'', fin:'', q:''};
let PER = 'month';
try { PER = localStorage.getItem('asg-per') || 'month'; } catch (e) {}
function fillSelect(id, label, vals){ $(id).innerHTML = `<option value="">All ${label}</option>` + vals.map(v => `<option>${esc(v)}</option>`).join(''); }
function filtered(){
  const q = F.q.trim().toLowerCase();
  return D.skus.filter(s => (!F.line || s.line === F.line) && (!F.src || s.src === F.src) && (!F.fin || s.c === F.fin) &&
    (!q || (s.sku + ' ' + s.p + ' ' + s.code).toLowerCase().includes(q)));
}
function setFilter(k, v){ F[k] = v; $({line:'#fLine', src:'#fSrc', fin:'#fFin', q:'#fQ'}[k]).value = v; render(); }
['line','src','fin'].forEach(k => $({line:'#fLine', src:'#fSrc', fin:'#fFin'}[k]).addEventListener('change', e => { F[k] = e.target.value; render(); }));
let qTimer; $('#fQ').addEventListener('input', e => { clearTimeout(qTimer); qTimer = setTimeout(() => { F.q = e.target.value; render(); }, 120); });
$('#fReset').addEventListener('click', () => { Object.keys(F).forEach(k => F[k] = ''); ['#fLine','#fSrc','#fFin','#fQ'].forEach(i => $(i).value = ''); render(); });
function syncPer(){ $$('[data-per]').forEach(b => b.setAttribute('aria-pressed', b.dataset.per === PER)); }
$$('[data-per]').forEach(b => b.addEventListener('click', () => { PER = b.dataset.per; try { localStorage.setItem('asg-per', PER); } catch (e) {} syncPer(); render(); }));
syncPer();

/* ---------- status helpers ---------- */
const STATUS = {
  make:   ['p-warn', s => D.sources[s.src]?.kind === 'import' ? 'Buy now' : 'Make now'],
  ok:     ['p-good', () => 'Covered'],
  over:   ['p-info', () => 'Overstock'],
  dead:   ['p-bad',  () => 'Dead stock'],
  longout:['p-bad',  () => 'Long out'],
};
const statusPill = s => { const [c, f] = STATUS[s.status]; return `<span class="pill ${c}">${esc(f(s))}</span>`; };
const lifePill = s => s.life === 'new' ? `<span class="pill p-info" title="Launch ${esc(s.launch)}">New</span>` : s.life === 'phaseout' ? `<span class="pill p-warn" title="Ends ${esc(s.end)}">Phase out</span>` : s.life === 'ended' ? '<span class="pill p-bad">Ended</span>' : '';
const confPill = c => `<span class="pill ${c === 'high' ? 'p-good' : c === 'medium' ? 'p-warn' : 'p-bad'}">${esc(c)}</span>`;
const daysPill = d => d == null ? '–' : `<span class="pill ${d <= 7 ? 'p-bad' : d <= 14 ? 'p-warn' : 'p-good'}">${nf(d)} d</span>`;
const prod = s => `<div class="prod">${esc(s.p)} ${lifePill(s)}<small>${esc(s.c)} · ${esc(s.z)}</small></div>`;
const isLow = s => s.dl != null && s.dl <= 14 && ['make', 'ok'].includes(s.status);

/* ---------- periods: weeks, or calendar months with weeks split at month ends ---------- */
function aggregate(list){
  const n = D.weeks.length, m = D.fweeks.length, z = k => Array(k).fill(0);
  const o = z(n), a = z(n), fm = z(m), d = z(m), e = z(m), p = z(m), vr = z(m);
  for (const s of list){ const h = D.H[s.id], f = D.F[s.id], sd = D.SD[s.id] || 0;
    for (let i = 0; i < n; i++){ o[i] += h[0][i]; a[i] += h[1][i]; }
    for (let i = 0; i < m; i++){ fm[i] += f[0][i]; d[i] += f[3][i]; e[i] += f[4][i]; p[i] += f[5][i]; if (f[0][i]) vr[i] += sd * sd; } }
  return {o, a, fm, d, e, p, vr};
}
/* points for charts and tables: {key, label, kind: 'h' | 'f' | 'mix', a, o, f, l, h, d, e, p, weeks: [{ws, share}]} */
function periods(agg, per = PER){
  const n = D.weeks.length, m = D.fweeks.length;
  if (per === 'week'){
    const pts = D.weeks.map((ws, i) => ({key: ws, label: dlabel(ws), kind: 'h', a: agg.a[i], o: agg.o[i]}));
    D.fweeks.forEach((ws, k) => { const sd = Math.sqrt(agg.vr[k]);
      pts.push({key: ws, label: dlabel(ws), kind: 'f', f: agg.fm[k], l: Math.max(agg.p[k], agg.fm[k] - 1.28 * sd), h: agg.fm[k] + (agg.fm[k] ? 1.28 * sd : 0), d: agg.d[k], e: agg.e[k], p: agg.p[k], weeks: [{ws, share: 1, k}]}); });
    return pts;
  }
  const asof = D.asof, map = new Map();
  const get = mo => map.get(mo) || (map.set(mo, {key: mo, label: mlabel(mo), a: 0, o: 0, f: 0, d: 0, e: 0, p: 0, vr: 0, hd: 0, fd: 0, weeks: []}), map.get(mo));
  D.weeks.forEach((ws, i) => { for (let j = 0; j < 7; j++){ const day = addDays(ws, j); if (day > asof) break; const r = get(day.slice(0, 7)); r.a += agg.a[i] / 7; r.o += agg.o[i] / 7; r.hd++; } });
  D.fweeks.forEach((ws, k) => { const per = {};
    for (let j = 0; j < 7; j++){ const day = addDays(ws, j); per[day.slice(0, 7)] = (per[day.slice(0, 7)] || 0) + 1; }
    for (const [mo, days] of Object.entries(per)){ const r = get(mo), sh = days / 7;
      r.f += agg.fm[k] * sh; r.d += agg.d[k] * sh; r.e += agg.e[k] * sh; r.p += agg.p[k] * sh; r.vr += agg.vr[k] * sh * sh; r.fd += days; r.weeks.push({ws, share: sh, k}); } });
  const out = [...map.values()].sort((x, y) => x.key < y.key ? -1 : 1);
  const first = out.findIndex(r => r.hd >= 20 || r.fd > 0);
  return out.slice(Math.max(0, first)).filter((r, i, arr) => !(i === arr.length - 1 && r.fd && !r.hd && r.fd < 20)).map(r => {
    const sd = Math.sqrt(r.vr);
    if (!r.fd) return {...r, kind: 'h'};
    const actual = r.a, f = r.f + actual;
    return {...r, kind: r.hd ? 'mix' : 'f', actual, f, l: Math.max(r.p + actual, f - 1.28 * sd), h: f + (r.f ? 1.28 * sd : 0), label: mlabel(r.key) + (r.hd ? '*' : '')};
  });
}
const futurePts = pts => pts.filter(p => p.kind !== 'h');
const PER_TXT = () => PER === 'month' ? 'next 2 months' : 'next 8 weeks';
const nextWindow = agg => PER === 'month' ? (() => { const fp = futurePts(periods(agg, 'month')); return sumA(fp.slice(0, 2).map(p => p.f - (p.actual || 0))) + 0; })() : sumA(agg.fm.slice(0, 8));
const lastWindow = agg => PER === 'month' ? sumA(agg.a.slice(-9)) * 8.7 / 9 : sumA(agg.a.slice(-8));

/* events that touch a set of SKUs */
function eventsFor(list){
  const lines = new Set(list.map(s => s.line)), skus = new Set(list.map(s => s.sku));
  return D.events.filter(e => (!e.line || lines.has(e.line)) && (!e.sku || skus.has(e.sku)));
}

/* ---------- tooltip ---------- */
const tip = $('#tip');
function showTip(x, y, html){ tip.innerHTML = html; tip.style.opacity = 1;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.max(8, Math.min(x + 14, innerWidth - w - 8)) + 'px'; tip.style.top = (y + h + 24 > innerHeight ? y - h - 12 : y + 14) + 'px'; }
const hideTip = () => tip.style.opacity = 0;
function wireTips(root){ $$('[data-tip]', root).forEach(el => {
  el.addEventListener('pointermove', e => showTip(e.clientX, e.clientY, el.dataset.tip)); el.addEventListener('pointerleave', hideTip);
  el.addEventListener('focus', () => { const r = el.getBoundingClientRect(); showTip(r.right, r.top, el.dataset.tip); }); el.addEventListener('blur', hideTip); }); }
const trow = (c, l, v, dash) => `<div class="r"><span><i class="key ${dash ? 'dash' : ''}" style="background:${c}"></i>${l}</span><b>${v}</b></div>`;

/* ---------- demand chart: history, forecast band, events, crosshair ---------- */
function niceStep(raw){ const p = Math.pow(10, Math.floor(Math.log10(raw || 1))), r = raw / p; return (r < 1.5 ? 1 : r < 3 ? 2 : r < 7 ? 5 : 10) * p; }
function demandChart(pts, evs = [], opts = {}){
  const N = pts.length, W = 800, H = opts.h || 280, L = 52, R = 14, T = 22, B = 30;
  const hi = pts.findIndex(p => p.kind !== 'h'), nH = hi < 0 ? N : hi;
  const max = Math.max(1, ...pts.map(p => Math.max(p.a || 0, p.o || 0, p.h || 0, p.f || 0))) * 1.08;
  const x = i => L + (W - L - R) * (N === 1 ? .5 : i / (N - 1)), y = v => H - B - (H - B - T) * v / max;
  const step = niceStep(max / 4); let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Demand history and forecast">`;
  for (let v = 0; v <= max; v += step) s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${big(v)}</text>`;
  if (nH < N) s += `<rect x="${x(nH - .5)}" y="${T}" width="${W - R - x(nH - .5)}" height="${H - B - T}" fill="var(--sunk)"/><text x="${x(nH - .5) + 6}" y="${T + 12}" style="font-weight:600">Forecast</text>`;
  const fp = pts.map((p, i) => [p, i]).filter(([p]) => p.kind !== 'h');
  if (fp.length){ let up = '', dn = ''; fp.forEach(([p, i], j) => up += `${j ? 'L' : 'M'}${x(i)},${y(p.h)}`); for (let j = fp.length - 1; j >= 0; j--) dn += `L${x(fp[j][1])},${y(fp[j][0].l)}`; s += `<path d="${up}${dn}Z" fill="var(--band)"/>`; }
  const path = arr => arr.map(([v, i], j) => `${j ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  const hp = pts.map((p, i) => [p, i]).filter(([p]) => p.kind === 'h');
  s += `<path d="${path(hp.map(([p, i]) => [p.o, i]))}" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linejoin="round"/>`;
  s += `<path d="${path(hp.map(([p, i]) => [p.a, i]))}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round"/>`;
  if (fp.length) s += `<path d="${path([...(hp.length ? [[hp[hp.length - 1][0].a, hp[hp.length - 1][1]]] : []), ...fp.map(([p, i]) => [p.f, i])])}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-dasharray="5 4"/>`;
  /* event markers */
  const evAt = i => { const p = pts[i], from = PER === 'week' || opts.per === 'week' ? p.key : p.key + '-01', to = PER === 'week' || opts.per === 'week' ? addDays(p.key, 6) : p.key + '-31';
    return evs.filter(e => e.start >= from && e.start <= to); }; // mark where each event starts
  pts.forEach((p, i) => { const ev = evAt(i); if (!ev.length) return; const cx = x(i), cy = T - 8, col = ev.some(e => e.type === 'price') ? 'var(--accent)' : 'var(--s2)';
    s += `<path d="M${cx},${cy - 5}L${cx + 5},${cy}L${cx},${cy + 5}L${cx - 5},${cy}Z" fill="${col}"/>`; });
  const step2 = Math.max(1, Math.ceil(N / 7));
  pts.forEach((p, i) => { if (i % step2 === 0 || i === N - 1) s += `<text x="${x(i)}" y="${H - 9}" text-anchor="${i === N - 1 ? 'end' : i === 0 ? 'start' : 'middle'}">${esc(p.label)}</text>`; });
  s += `<line class="xh" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-width="1" opacity="0"/><circle class="xd" r="4" fill="var(--s1)" stroke="var(--panel)" stroke-width="2" opacity="0"/>`;
  s += `<rect class="hit" x="${L - 10}" y="0" width="${W - L - R + 20}" height="${H - B}" fill="transparent"/></svg>`;
  return {svg: s, wire(root){
    const svg = $('svg', root), xh = $('.xh', root), xd = $('.xd', root), hit = $('.hit', root);
    hit.addEventListener('pointermove', e => { const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * W / r.width;
      const i = Math.max(0, Math.min(N - 1, Math.round((px - L) / (W - L - R) * (N - 1)))), p = pts[i];
      xh.setAttribute('x1', x(i)); xh.setAttribute('x2', x(i)); xh.setAttribute('opacity', .6);
      const v = p.kind === 'h' ? p.a : p.f; xd.setAttribute('cx', x(i)); xd.setAttribute('cy', y(v)); xd.setAttribute('opacity', 1);
      const ev = evAt(i).map(e => `<div class="r"><span>◆ ${esc(e.name)}</span></div>`).join('');
      const per = PER === 'week' || opts.per === 'week' ? `Week of ${esc(p.label)}` : esc(p.label.replace('*', ''));
      const html = p.kind === 'h'
        ? `<div class="t">${per}</div>${trow('var(--s1)', 'Demand', nf(p.a))}${trow('var(--s2)', 'Shipped', nf(p.o))}${p.a - p.o > .5 ? trow('var(--bad)', 'Unmet', nf(p.a - p.o)) : ''}${ev}`
        : `<div class="t">${per}, forecast${p.kind === 'mix' ? ` (includes ${nf(p.actual)} actual so far)` : ''}</div>${trow('var(--s1)', 'Forecast', nf(p.f), 1)}${trow('var(--band)', 'Likely range', nf(p.l) + ' to ' + nf(p.h))}
           ${p.e > .5 || p.p > .5 ? trow('transparent', 'Dealer', nf(p.d)) + trow('transparent', 'Export', nf(p.e)) + trow('transparent', 'Project', nf(p.p)) : ''}${ev}`;
      showTip(e.clientX, e.clientY, html); });
    hit.addEventListener('pointerleave', () => { hideTip(); xh.setAttribute('opacity', 0); xd.setAttribute('opacity', 0); });
  }};
}
const chartLegend = `<div class="legend"><span><i class="key" style="background:var(--s1)"></i>Demand after stockout adjustment</span><span><i class="key" style="background:var(--s2)"></i>Shipped</span><span><i class="key dash"></i>Forecast</span><span><i class="key box" style="background:var(--band)"></i>Likely range, 80%</span><span>◆ price change or promotion</span></div>`;
function lineChart(vals, labels, {h = 150, fmt = big, color = 'var(--s1)', mark = null} = {}){
  const W = 360, H = h, L = 40, R = 8, T = 10, B = 22, N = vals.length, ok = vals.filter(v => v != null);
  if (!ok.length) return '<div class="empty">No data uploaded.</div>';
  let lo = Math.min(...ok), hi = Math.max(...ok); const pad = (hi - lo) * .15 || hi * .05 || 1; lo -= pad; hi += pad;
  const x = i => L + (W - L - R) * i / Math.max(1, N - 1), y = v => H - B - (H - B - T) * (v - lo) / (hi - lo);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  [lo + pad, (lo + hi) / 2, hi - pad].forEach(v => s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 4}" y="${y(v) + 3}" text-anchor="end">${fmt(v)}</text>`);
  if (mark != null) s += `<rect x="${x(mark)}" y="${T}" width="${W - R - x(mark)}" height="${H - B - T}" fill="var(--sunk)"/>`;
  s += `<path d="${vals.map((v, i) => v == null ? '' : `${i && vals[i - 1] != null ? 'L' : 'M'}${x(i)},${y(v)}`).join('')}" fill="none" stroke="${color}" stroke-width="2"/>`;
  [0, Math.floor(N / 2), N - 1].forEach(i => s += `<text x="${x(i)}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : i === N - 1 ? 'end' : 'middle'}">${esc(labels[i])}</text>`);
  vals.forEach((v, i) => { if (v != null) s += `<rect x="${x(i) - (W - L) / N / 2}" y="${T}" width="${(W - L) / N}" height="${H - B - T}" fill="transparent" data-tip="${esc(`<div class='t'>${esc(labels[i])}</div><b>${nf(v, v < 100 ? 1 : 0)}</b>`)}"/>`; });
  return s + '</svg>';
}

/* ---------- sortable tables ---------- */
const sortState = {};
function sortable(key, cols, rows, opts = {}){
  const st = sortState[key] || (sortState[key] = {k: opts.sort || null, d: opts.dir || -1});
  if (st.k){ const c = cols.find(c => c.k === st.k); const v = c?.v || (r => r[st.k]);
    rows = [...rows].sort((a, b) => { const x = v(a), y = v(b); if (x == null) return 1; if (y == null) return -1;
      return (typeof x === 'string' ? x.localeCompare(y) : x - y) * st.d; }); }
  const lim = opts.limit && rows.length > opts.limit ? opts.limit : rows.length;
  return `<div class="tblwrap"><table data-key="${key}"><thead><tr>${cols.map(c => `<th class="${c.n ? 'n' : ''} ${c.k ? 'sort' : ''}" ${c.k ? `data-k="${c.k}" tabindex="0" aria-sort="${st.k === c.k ? (st.d > 0 ? 'ascending' : 'descending') : 'none'}"` : ''}>${c.h}${st.k === c.k ? `<span class="arr">${st.d > 0 ? '▲' : '▼'}</span>` : ''}</th>`).join('')}</tr></thead>
    <tbody>${rows.slice(0, lim).map(r => `<tr class="${r.id ? 'click' : ''}" ${r.id ? `data-id="${esc(r.id)}" tabindex="0"` : ''}>${cols.map(c => `<td class="${c.n ? 'n' : ''} ${c.cls || ''}">${c.f ? c.f(r) : esc(r[c.k])}</td>`).join('')}</tr>`).join('') ||
      `<tr><td colspan="${cols.length}" class="empty">${esc(opts.empty || 'Nothing here for the current filters.')}</td></tr>`}</tbody></table></div>${lim < rows.length ? `<p class="note">Showing ${lim} of ${rows.length}. Narrow the filters or sort to see others.</p>` : ''}`;
}
function wireTables(root){
  $$('th.sort', root).forEach(th => { const go = () => { const key = th.closest('table').dataset.key, st = sortState[key];
    st.d = st.k === th.dataset.k ? -st.d : -1; st.k = th.dataset.k; render(); };
    th.addEventListener('click', go); th.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } }); });
  $$('tr.click', root).forEach(tr => { tr.addEventListener('click', e => { if (e.target.closest('input,button,label')) return; openSku(tr.dataset.id); });
    tr.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.target.closest('input')) openSku(tr.dataset.id); }); });
}

/* ---------- capacity schedule: most urgent first, each factory filled week by week ---------- */
function schedule(list){
  const out = {}, load = {};
  for (const [name, src] of Object.entries(D.sources)){
    const orders = list.filter(s => s.src === name && planQty(s) > 0).sort((a, b) => (a.dl ?? 1e9) - (b.dl ?? 1e9));
    const cap = src.cap || Infinity, left = Array(D.sched).fill(cap), use = Array(D.sched).fill(0);
    for (const s of orders){ let q = planQty(s), sw = null, fw = null;
      if (src.kind === 'import'){ out[s.id] = {sw: 0, fw: 0, ready: addDays(D.asof, 1 + src.lt), late: s.dl != null && src.lt > s.dl}; continue; }
      for (let w = 0; w < D.sched && q > 0; w++){ const take = Math.min(q, left[w]); if (take <= 0) continue; if (sw == null) sw = w; fw = w; left[w] -= take; use[w] += take; q -= take; }
      if (q > 0){ sw ??= D.sched; fw = D.sched; }
      const ready = addDays(D.asof, 1 + 7 * sw + src.lt);
      out[s.id] = {sw, fw, ready, late: s.dl != null && 7 * sw + src.lt > s.dl, spill: q > 0};
    }
    load[name] = {cap: src.cap, use, kind: src.kind};
  }
  return {by: out, load};
}

          ${hol.map(h => `<li><b>Calendar</b><span>Week of ${dlabel(h.ws)}: ${esc(h.why.map(w => w[0]).join(', '))} (${pct(h.m - 1)})</span></li>`).join('')}
          ${Object.entries(D.elasticity).filter(([l, v]) => v.beta > .1 && (!F.line || F.line === l)).slice(0, 2).map(([l, v]) => `<li><b>Construction</b><span>${esc(l)} follows cement sales 6 months earlier (elasticity ${v.beta.toFixed(2)}).</span></li>`).join('')}
          ${list.filter(s => s.dcov && Math.abs(s.dcov - 1) > .3).length ? `<li><b>Dealer stock</b><span>${list.filter(s => s.dcov > 1.3).length} SKUs overstocked at dealers, ${list.filter(s => s.dcov && s.dcov < .7).length} understocked. Next 8 weeks adjusted.</span></li>` : ''}
        </ul></section>
    </div>
    <div class="grid g2">
      <section class="panel"><div class="panel-head"><h2>Factory load</h2><span class="note">Average weekly forecast against weekly capacity (black mark).</span></div>
        <div class="bars">${fac.map(f => `<button class="barrow ${F.src === f.k ? 'on' : ''}" data-src="${esc(f.k)}" type="button"
          data-tip="${esc(`<div class='t'>${esc(f.k)}</div><div class='r'><span>Forecast per week</span><b>${nf(f.fc)}</b></div><div class='r'><span>Capacity per week</span><b>${nf(f.cap)}</b></div><div class='r'><span>Load</span><b>${nf(100 * f.fc / f.cap)}%</b></div><div class='r'><span>In this week's plan</span><b>${nf(f.plan)}</b></div>`)}">
          <span class="bl">${esc(f.k)}</span><span class="track"><span class="fill ${f.fc > f.cap ? 'over' : ''}" style="width:${100 * f.fc / fmax}%"></span><span class="capmark" style="left:${100 * f.cap / fmax}%"></span></span>
          <span class="bv">${nf(100 * f.fc / f.cap)}%</span></button>`).join('') || `<ul class="notes">${[...new Set(list.map(s => s.src))].map(k => `<li><b>Imported</b><span>${esc(k)}: no factory capacity applies. Lead time ${D.sources[k].lt} days, minimum order ${nf(D.sources[k].moq)}.</span></li>`).join('')}</ul>`}</div>
        <p class="note">Click a factory to filter. The production plan tab shows the week by week schedule.</p></section>
      <section class="panel"><div class="panel-head"><h2>Does the forecast beat the old method?</h2></div>

        ${sortable('acc', [{h: 'Test', k: 'line'}, {h: 'Forecast', n: 1, k: 'sel', f: r => nf(r.sel * 100, 1) + '%'}, {h: 'Old method', n: 1, k: 'base', f: r => nf(r.base * 100, 1) + '%'},
          {h: 'Result', f: r => r.sel < r.base ? `<span class="pill p-good">${nf((1 - r.sel / r.base) * 100)}% better</span>` : '<span class="pill p-bad">Old wins</span>'}],
          [{line: 'Monthly totals', sel: D.acc.msel, base: D.acc.mbase}, {line: 'Weekly, whole catalog', sel: D.acc.sel, base: D.acc.base}, {line: 'Latest 8 weeks only', sel: D.acc.hsel, base: D.acc.hbase},
           ...D.acc.lines.filter(r => list.some(s => s.line === r.line))])}</section>
    </div>`,

/* forecast table: product lines with SKUs, months that open into weeks */
let fChan = 'total', openLines = new Set(), openMonth = null;
views.forecast = list => {
  const ci = {total: 0, dealer: 3, export: 4, project: 5}[fChan];
  const one = s => { const a = aggregate([s]); if (ci) { a.fm = D.F[s.id][ci].slice(); a.vr = a.vr.map(() => 0); } return futurePts(periods(a)); };
  const tmpl = futurePts(periods(aggregate(list.slice(0, 1))));
  const cols = [];
  tmpl.forEach((p, j) => { cols.push({type: 'p', j, label: p.label, key: p.key});
    if (PER === 'month' && openMonth === p.key){ if (p.kind === 'mix') cols.push({type: 'a', j, label: 'shipped so far'});
      p.weeks.forEach(w => cols.push({type: 'w', j, ws: w.ws, k: w.k, share: w.share, label: dlabel(w.ws, false)})); } });
  const val = (pts, c, s) => { const p = pts[c.j]; if (!p) return 0;
    if (c.type === 'p') return ci ? p.f - (p.actual || 0) : p.f;
    if (c.type === 'a') return ci ? 0 : p.actual || 0;
    const f = D.F[s.id][ci]; return f[c.k] * c.share; };
  const rowsBy = {}; list.forEach(s => (rowsBy[s.line] ||= []).push(s));
  const skuPts = Object.fromEntries(list.map(s => [s.id, one(s)]));
  const cell = (v, c) => `<td class="n ${c.type !== 'p' ? 'wkcol' : ''}">${nf(v)}</td>`;
  let body = '';
  for (const [line, mem] of Object.entries(rowsBy).sort()){
    const tot = cols.map(c => sum(mem, s => val(skuPts[s.id], c, s)));
    const open = openLines.has(line);
    body += `<tr class="grp"><td data-grp="${esc(line)}" tabindex="0"><span class="caret">${open ? '▾' : '▸'}</span>${esc(line)} <span class="note">${mem.length} SKUs</span></td>${tot.map((v, i) => cell(v, cols[i])).join('')}<td class="n">${nf(sumA(tot.filter((_, i) => cols[i].type === 'p')))}</td></tr>`;
    if (open) for (const s of mem.sort((a, b) => b.wk - a.wk)){ const v = cols.map(c => val(skuPts[s.id], c, s));
      body += `<tr class="click" data-id="${s.id}" tabindex="0"><td><span class="sku">${esc(s.sku)}</span> ${lifePill(s)}</td>${v.map((x, i) => cell(x, cols[i])).join('')}<td class="n">${nf(sumA(v.filter((_, i) => cols[i].type === 'p')))}</td></tr>`; }
  }
  const gtot = cols.map(c => sum(list, s => val(skuPts[s.id], c, s)));
  return {html: `<section class="panel"><div class="panel-head"><div><h2>${PER === 'month' ? 'Monthly' : 'Weekly'} forecast</h2>
      <div class="note">${PER === 'month' ? 'Click a month to split it into weeks. Weeks are cut at month ends so they add up to the month. The first month (*) includes sales already shipped.' : 'Each column is a week starting Monday.'} Click a product line to see its SKUs, and a SKU for its detail.</div></div>
      <div class="toolbar"><div class="seg" role="group" aria-label="Channel">${[['total', 'All channels'], ['dealer', 'Dealer'], ['export', 'Export'], ['project', 'Project']].map(([k, l]) => `<button type="button" data-ch="${k}" aria-pressed="${fChan === k}">${l}</button>`).join('')}</div>
        <button class="btn" id="openAll" type="button">${openLines.size ? 'Collapse all' : 'Expand all'}</button><button class="btn" id="copyFc" type="button">Copy as CSV</button></div></div>
    <div class="tblwrap"><table><thead><tr><th>Product line / SKU</th>${cols.map(c => c.type === 'p'
      ? `<th class="n ${PER === 'month' ? 'mon' : ''}" ${PER === 'month' ? `data-mon="${c.key}" tabindex="0" title="Split into weeks"` : ''}>${PER === 'month' ? `<span class="caret">${openMonth === c.key ? '▾' : '▸'}</span>` : ''}${esc(c.label)}</th>`
      : `<th class="n wkcol">${c.type === 'a' ? esc(c.label) : 'w/c ' + esc(c.label)}</th>`).join('')}<th class="n">Total</th></tr></thead>
      <tbody>${body || `<tr><td class="empty" colspan="${cols.length + 2}">Nothing in this filter.</td></tr>`}
      <tr class="grp"><td>All shown</td>${gtot.map((v, i) => cell(v, cols[i])).join('')}<td class="n">${nf(sumA(gtot.filter((_, i) => cols[i].type === 'p')))}</td></tr></tbody></table></div>
    ${fChan === 'project' ? '<p class="note">Project demand is only what is confirmed in the order book; one off project orders are never extrapolated.</p>' : ''}</section>`,
    after(root){
      $$('[data-ch]', root).forEach(b => b.addEventListener('click', () => { fChan = b.dataset.ch; render(); }));
      $$('[data-grp]', root).forEach(td => { const go = () => { const l = td.dataset.grp; openLines.has(l) ? openLines.delete(l) : openLines.add(l); render(); };
        td.addEventListener('click', go); td.addEventListener('keydown', e => { if (e.key === 'Enter') go(); }); });
      $$('[data-mon]', root).forEach(th => { const go = () => { openMonth = openMonth === th.dataset.mon ? null : th.dataset.mon; render(); };
        th.addEventListener('click', go); th.addEventListener('keydown', e => { if (e.key === 'Enter') go(); }); });
      $('#openAll', root).addEventListener('click', () => { openLines = openLines.size ? new Set() : new Set(list.map(s => s.line)); render(); });
      $('#copyFc', root).addEventListener('click', () => {
        const head = ['sku', 'product', 'finish', 'size', 'line', 'channel', ...cols.map(c => c.type === 'p' ? c.key : c.type === 'a' ? 'shipped so far' : 'week ' + c.ws)];
        const rows = [head, ...list.map(s => [s.sku, s.p, s.c, s.z, s.line, fChan, ...cols.map(c => Math.round(val(skuPts[s.id], c, s)))])];
        const csv = rows.map(r => r.map(v => /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : v).join(',')).join('\n');
        navigator.clipboard.writeText(csv).then(() => toast(`Copied ${list.length} SKUs. Paste into Excel.`)).catch(() => toast('Copy was blocked by the browser.'));
      });
    }};
};

const STATUS_ORDER = {make: 0, longout: 1, dead: 2, over: 3, ok: 4};
let pStatus = '';
views.products = list => {

      <div class="toolbar"><span class="note">Show</span>${[['', 'All', list.length], ['make', 'Make or buy now', counts.make || 0], ['ok', 'Covered', counts.ok || 0], ['over', 'Overstock', counts.over || 0], ['dead', 'Dead stock', counts.dead || 0], ['longout', 'Long out', counts.longout || 0]]
        .map(([k, l, c]) => `<button class="btn small ${pStatus === k ? 'primary' : ''}" data-st="${k}" type="button">${esc(l)} <span style="font-family:var(--mono)">${c}</span></button>`).join('')}</div></div>
    ${sortable('products', [
      {h: 'SKU', k: 'sku', cls: 'sku'}, {h: 'Product', k: 'p', f: prod}, {h: 'Line', k: 'line'},
      {h: 'On hand', n: 1, k: 'oh', f: r => nf(r.oh)}, {h: 'Forecast / wk', n: 1, k: 'wk', f: r => nf(r.wk)},
      {h: 'Days left', n: 1, k: 'dl', f: r => daysPill(r.dl)}, {h: 'Reorder point', n: 1, k: 'rop', f: r => nf(r.rop)},
      {h: 'Plan', n: 1, k: 'q', v: planQty, f: r => planQty(r) ? `<b>${nf(planQty(r))}</b>` : '–'},
      {h: 'Status', k: 'status', v: r => STATUS_ORDER[r.status], f: statusPill}], rows, {sort: 'status', dir: 1, empty: 'No SKUs in this status for the current filters.'})}
    <p class="note">Click a row for its demand history, forecast, the drivers behind it and the reasoning behind the plan.</p></section>`,
    after(root){ $$('[data-st]', root).forEach(b => b.addEventListener('click', () => { pStatus = b.dataset.st; render(); })); }};
};

views.plan = list => {
  const inPlan = list.filter(s => planQty(s) > 0 || s.q > 0), sch = schedule(list);
  const groups = {}; inPlan.forEach(s => (groups[s.src] ||= []).push(s));
  const tot = sum(inPlan, planQty), val = sum(inPlan, s => planQty(s) * (s.cost || 0)), nOk = inPlan.filter(approved).length, late = inPlan.filter(s => sch.by[s.id]?.late);
  const facs = Object.entries(sch.load).filter(([k, v]) => v.kind === 'factory' && list.some(s => s.src === k));
  const wk = Array.from({length: D.sched}, (_, w) => addDays(D.asof, 1 + 7 * w));
  /* materials for the plan in this filter */
  const need = {}; list.forEach(s => (D.bom[s.sku] || []).forEach(([m, per]) => { const o = need[m] ||= {m, plan: 0, next13: 0}; o.plan += planQty(s) * per; o.next13 += sumA(D.F[s.id][0].slice(0, 13)) * per; }));
  const mats = Object.values(need).map(o => { const st = D.matStock[o.m] || {}; const have = (st.on_hand || 0) + (st.on_order || 0);
    return {...o, unit: st.unit || '', on_hand: st.on_hand || 0, on_order: st.on_order || 0, lt: st.lt, cover: o.next13 ? have / (o.next13 / 13) : null, short: Math.max(0, o.plan - (st.on_hand || 0))}; });
  return {html: `
    <section class="panel"><div class="panel-head"><div><h2>Production and purchase plan</h2>
      <div class="note">${inPlan.length} SKUs, ${nf(tot)} units, EGP ${nf(val)} at cost. ${nOk} of ${inPlan.length} approved.${late.length ? ` <b style="color:var(--bad)">${late.length} will arrive after stock runs out.</b>` : ''} Edits stay in this browser.</div></div>
      <div class="toolbar"><button class="btn primary" id="approveAll" type="button">Approve all shown</button><button class="btn" id="copyCsv" type="button">Copy plan as CSV</button><button class="btn" id="resetPlan" type="button">Undo my edits</button></div></div>
      <p class="note">Quantities cover forecast demand over lead time plus 3 weeks, rounded up to full cartons and the minimum batch. Factory orders are scheduled most urgent first within weekly capacity.</p></section>
    ${facs.length ? `<section class="panel"><div class="panel-head"><h2>Factory schedule, next ${D.sched} weeks</h2><span class="note">Planned units against weekly capacity. Red is full.</span></div>
      <div class="tblwrap"><div class="loadgrid" style="min-width:640px"><span></span>${wk.map(w => `<span class="h">w/c ${dlabel(w, false)}</span>`).join('')}
      ${facs.map(([k, v]) => `<span class="bl">${esc(k)}</span>${v.use.map(u => { const p = v.cap ? u / v.cap : 0; return `<div class="cell" data-tip="${esc(`<div class='t'>${esc(k)}</div><div class='r'><span>Planned</span><b>${nf(u)}</b></div><div class='r'><span>Capacity</span><b>${nf(v.cap)}</b></div>`)}"><i class="${p >= .999 ? 'over' : ''}" style="width:${Math.min(100, 100 * p)}%"></i><span>${nf(100 * p)}%</span></div>`; }).join('')}`).join('')}</div></div></section>` : ''}
    ${Object.keys(D.sources).filter(k => groups[k]).map(k => { const g = groups[k], src = D.sources[k], u = sum(g, planQty);
      return `<section class="panel"><div class="src-head"><div><h2>${esc(k)}</h2><div class="note">${src.kind === 'factory' ? 'Production order' : 'Purchase order'} · lead time ${src.lt} days · cartons of ${src.pack} · minimum batch ${nf(src.moq)}</div></div>
        <div class="note">${nf(u)} units, EGP ${nf(sum(g, s => planQty(s) * (s.cost || 0)))}</div></div>
        ${sortable('plan-' + k, [
          {h: 'OK', f: r => `<input type="checkbox" class="appr" data-id="${r.id}" ${approved(r) ? 'checked' : ''} aria-label="Approve ${esc(r.sku)}">`},
          {h: 'SKU', k: 'sku', cls: 'sku'}, {h: 'Product', k: 'p', f: prod}, {h: 'Stock position', n: 1, k: 'pos', f: r => nf(r.pos)},
          {h: 'Days left', n: 1, k: 'dl', f: r => daysPill(r.dl)},
          {h: 'Plan qty', n: 1, k: 'pq', v: planQty, f: r => `<input class="qty ${planQty(r) !== r.q ? 'changed' : ''}" type="number" min="0" step="${src.pack}" value="${planQty(r)}" data-id="${r.id}" aria-label="Plan quantity for ${esc(r.sku)}">`},
          {h: src.kind === 'factory' ? 'Starts' : 'Order', k: 'sw', v: r => sch.by[r.id]?.sw, f: r => { const b = sch.by[r.id]; return b ? (b.sw >= D.sched ? '<span class="pill p-bad">No capacity</span>' : 'w/c ' + dlabel(addDays(D.asof, 1 + 7 * b.sw), false)) : '–'; }},
          {h: 'Ready', k: 'rd', v: r => sch.by[r.id]?.ready, f: r => { const b = sch.by[r.id]; return b ? `${dlabel(b.ready, false)} ${b.late ? '<span class="pill p-bad">Late</span>' : ''}` : '–'; }},
          {h: 'EGP', n: 1, k: 'val', v: r => planQty(r) * (r.cost || 0), f: r => r.cost ? nf(planQty(r) * r.cost) : '<span class="pill p-bad">no cost</span>'},
          {h: 'Confidence', k: 'conf', f: r => confPill(r.conf)}], g, {sort: 'dl', dir: 1})}</section>`; }).join('') || '<section class="panel empty">Nothing to make or buy in the current filter. Stock covers forecast demand.</section>'}
    <section class="panel"><div class="panel-head"><h2>Raw materials</h2><span class="note">Need for this plan, and weeks of cover against the next 13 weeks of forecast.</span></div>
      ${sortable('mats', [{h: 'Material', k: 'm'}, {h: 'Unit', k: 'unit'}, {h: 'This plan needs', n: 1, k: 'plan', f: r => nf(r.plan)}, {h: 'On hand', n: 1, k: 'on_hand', f: r => nf(r.on_hand)},
        {h: 'On order', n: 1, k: 'on_order', f: r => nf(r.on_order)}, {h: 'Weeks of cover', n: 1, k: 'cover', f: r => r.cover == null ? '–' : nf(r.cover, 1)},
        {h: 'Status', k: 'short', v: r => -r.short, f: r => r.short > 0 ? `<span class="pill p-bad">Short ${nf(r.short)}</span>` : r.cover != null && r.lt && r.cover * 7 < r.lt ? '<span class="pill p-warn">Reorder now</span>' : '<span class="pill p-good">OK</span>'}],
        mats, {sort: 'short', dir: 1, empty: 'No bill of materials for these SKUs. Upload one on the Upload data tab.'})}</section>`,
    after(root){
      $$('input.qty', root).forEach(i => i.addEventListener('change', () => { const s = byId[i.dataset.id], v = Math.max(0, Math.round(+i.value || 0)); setEdit(s, {q: v}); toast(`${s.sku} set to ${nf(v)}`); render(); }));
      $$('input.appr', root).forEach(c => c.addEventListener('change', () => { setEdit(byId[c.dataset.id], {ok: c.checked}); render(); }));
      $('#approveAll', root).addEventListener('click', () => { list.filter(s => planQty(s) > 0).forEach(s => setEdit(s, {ok: true})); toast('Plan approved'); render(); });
      $('#resetPlan', root).addEventListener('click', () => { edits = {}; saveEdits(); toast('Edits undone'); render(); });
      $('#copyCsv', root).addEventListener('click', () => {
        const rows = [['source', 'sku', 'product', 'finish', 'size', 'qty', 'start_week', 'ready', 'unit_cost_egp', 'value_egp', 'approved']].concat(
          list.filter(s => planQty(s) > 0).map(s => { const b = sch.by[s.id] || {}; return [s.src, s.sku, s.p, s.c, s.z, planQty(s), b.sw != null && b.sw < D.sched ? addDays(D.asof, 1 + 7 * b.sw) : '', b.ready || '', s.cost ?? '', s.cost ? Math.round(planQty(s) * s.cost) : '', approved(s) ? 'yes' : 'no']; }));
        const csv = rows.map(r => r.map(v => /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : v).join(',')).join('\n');
        navigator.clipboard.writeText(csv).then(() => toast(`Copied ${rows.length - 1} lines. Paste into Excel.`)).catch(() => toast('Copy was blocked by the browser.'));
      });
    }};
};

views.health = list => {
  const low = list.filter(isLow), dead = list.filter(s => s.status === 'dead' || s.status === 'longout'), over = list.filter(s => s.status === 'over');
  const skus = new Set(list.map(s => s.sku)), cr = D.cancel.rows.filter(c => skus.has(c.sku));
  const win = (from, w) => { const r = cr.filter(c => c.date > from); return {w, o: r.length, u: sum(r, c => c.qty), v: sum(r, c => c.value)}; };
  const why = {}; cr.filter(c => c.date > D.cancel.c90).forEach(c => { const o = why[c.reason || 'Not given'] ||= {r: c.reason || 'Not given', o: 0, v: 0}; o.o++; o.v += c.value || 0; });
  return {html: `
    <section class="panel"><div class="panel-head"><h2>Running out within 14 days</h2><span class="note">Free stock divided by forecast daily demand. Dealer value at risk uses the price list.</span></div>
      ${sortable('low', [{h: 'SKU', k: 'sku', cls: 'sku'}, {h: 'Product', k: 'p', f: prod}, {h: 'Days left', n: 1, k: 'dl', f: r => daysPill(r.dl)},
        {h: 'EGP at risk / day', n: 1, k: 'risk', v: r => r.wk / 7 * (r.price || (r.cost || 0) * D.margin), f: r => nf(r.wk / 7 * (r.price || (r.cost || 0) * D.margin))},
        {h: 'Incoming', n: 1, k: 'inc', f: r => nf(r.inc)}, {h: 'Action', f: r => planQty(r) ? `${D.sources[r.src]?.kind === 'import' ? 'Buy' : 'Make'} ${nf(planQty(r))}` : r.inc ? 'Chase incoming order' : 'Review'}], low, {sort: 'dl', dir: 1, empty: 'Nothing runs out within 14 days in this filter.'})}</section>

/* merchandise view: sales by month side by side, then total, stock, forecast and what to order or clear */
let mPer = 'l12', mMeasure = 'units', mFc = 3, mDept = '', mSort = {k: null, d: -1};
const unitPrice = s => s.price || (s.cost || 0) * D.margin;
function merchMonths(){
  const all = D.months, cur = D.asof.slice(0, 7), full = all.filter(m => m < cur);
  if (mPer === 'l12') return full.slice(-12);
  if (mPer === 'l24') return full.slice(-24);
  return all.filter(m => m.startsWith(mPer));
}
function fcMonths(s){ return ENGINE.toMonths(D.fweeks, D.F[s.id][0], addDays(D.asof, 1)).slice(0, mFc); }
views.merch = list => {
  const months = merchMonths(), idx = months.map(m => D.months.indexOf(m)), cur = D.asof.slice(0, 7);
  const years = [...new Set(D.months.map(m => m.slice(0, 4)))].reverse();
  const k = s => mMeasure === 'egp' ? unitPrice(s) : 1;
  const sales = s => idx.map(i => (D.M[s.id][i] || 0) * k(s));
  const prevIdx = months.map(m => D.months.indexOf(`${+m.slice(0, 4) - 1}${m.slice(4)}`));
  const prevTot = s => prevIdx.reduce((t, i) => t + (i >= 0 ? (D.M[s.id][i] || 0) * k(s) : 0), 0);
  const fcLabel = (() => { const f = list.length ? fcMonths(list[0]) : []; return f.length ? `${mlabel(f[0].m, false)}${f.length > 1 ? '–' + mlabel(f[f.length - 1].m, false) : ''}` : ''; })();
  const ml = m => mlabel(m) + (m === cur ? '*' : '');
  const fmtV = v => mMeasure === 'egp' ? big(v) : nf(v);

  /* departments by month */
  const depts = {}; list.forEach(s => (depts[s.dept] ||= []).push(s));
  const drow = Object.entries(depts).map(([d, mem]) => { const v = months.map((_, j) => sum(mem, s => sales(s)[j])), tot = sumA(v), prev = sum(mem, prevTot);
    return {d, v, tot, prev, n: mem.length}; }).sort((a, b) => b.tot - a.tot);
  const grand = months.map((_, j) => sumA(drow.map(r => r.v[j]))), gtot = sumA(grand), gprev = sumA(drow.map(r => r.prev));
  const spark = v => { const mx = Math.max(1, ...v), W = 90, H = 22; return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${v.map((x, i) => `${i ? 'L' : 'M'}${(W - 2) * i / Math.max(1, v.length - 1) + 1},${H - 2 - (H - 4) * x / mx}`).join('')}" fill="none" stroke="var(--s1)" stroke-width="1.5"/></svg>`; };
  const yoy = (t, p) => p ? `<span class="pill ${t >= p ? 'p-good' : 'p-bad'}">${pct(t / p - 1)}</span>` : '–';

  /* SKUs */
  const rows = list.filter(s => !mDept || s.dept === mDept).map(s => { const v = sales(s), f = sumA(fcMonths(s).map(r => r.v)) * k(s), q = planQty(s);
    return {s, v, tot: sumA(v), stock: Math.max(0, s.oh) * k(s), fc: f, act: q > 0 ? q * k(s) : -(s.ovq || 0) * k(s), q, ovq: s.ovq || 0}; });
  const keyOf = {sku: r => r.s.sku, tot: r => r.tot, stock: r => r.stock, fc: r => r.fc, act: r => r.act};
  months.forEach((m, j) => keyOf['m' + j] = r => r.v[j]);
  if (mSort.k) rows.sort((a, b) => { const x = keyOf[mSort.k](a), y = keyOf[mSort.k](b); return (typeof x === 'string' ? x.localeCompare(y) : x - y) * mSort.d; });
  else rows.sort((a, b) => a.s.dept.localeCompare(b.s.dept) || a.s.line.localeCompare(b.s.line) || b.tot - a.tot);
  const th = (key, label, cls = 'n') => `<th class="${cls} msort" data-mk="${key}" tabindex="0">${label}${mSort.k === key ? `<span class="arr">${mSort.d > 0 ? '▲' : '▼'}</span>` : ''}</th>`;
  const heat = (v, mx) => mx ? `style="background:color-mix(in srgb, var(--s1) ${Math.round(32 * v / mx)}%, transparent)"` : '';
  const act = r => r.q > 0 ? `<span class="pill p-warn">Order ${fmtV(r.act)}</span>` : r.ovq > 0 ? `<span class="pill ${r.s.status === 'over' ? 'p-info' : 'p-bad'}">Overstock ${fmtV(-r.act)}</span>` : '<span class="note">–</span>';
  const skuRow = r => { const mx = Math.max(...r.v);
    return `<tr class="click" data-id="${r.s.id}" tabindex="0"><td><span class="sku">${esc(r.s.sku)}</span> ${lifePill(r.s)}<small style="display:block;color:var(--muted);font-size:12px">${esc(r.s.p)} · ${esc(r.s.c)} · ${esc(r.s.z)}</small></td>
      ${r.v.map(v => `<td class="n" ${heat(v, mx)} title="${nf(v)}">${v ? big(v) : '<span class="note">–</span>'}</td>`).join('')}<td class="n tcol"><b>${fmtV(r.tot)}</b></td><td class="n">${fmtV(r.stock)}</td><td class="n">${fmtV(r.fc)}</td><td class="n">${act(r)}</td></tr>`; };
  let body = '', lastDept = null;
  for (const r of rows){
    if (!mSort.k && r.s.dept !== lastDept){ lastDept = r.s.dept; const mem = rows.filter(x => x.s.dept === lastDept);
      const v = months.map((_, j) => sumA(mem.map(x => x.v[j])));
      body += `<tr class="grp"><td>${esc(lastDept)} <span class="note">${mem.length} SKUs</span></td>${v.map(x => `<td class="n">${fmtV(x)}</td>`).join('')}<td class="n tcol">${fmtV(sumA(v))}</td>
        <td class="n">${fmtV(sumA(mem.map(x => x.stock)))}</td><td class="n">${fmtV(sumA(mem.map(x => x.fc)))}</td><td class="n note">${mem.filter(x => x.q > 0).length} to order · ${mem.filter(x => x.q <= 0 && x.ovq > 0).length} over</td></tr>`; }
    body += skuRow(r);
  }
  const seg = (name, cur, opts) => `<div class="seg" role="group" aria-label="${name}">${opts.map(([v, l]) => `<button type="button" data-${name}="${v}" aria-pressed="${String(cur) === String(v)}">${l}</button>`).join('')}</div>`;
  return {html: `
    <section class="panel"><div class="panel-head"><div><h2>Merchandise view</h2>
      <div class="note">Shipped sales by month (cancelled orders excluded), then total, stock on hand, forecast and what to order or clear. ${months.includes(cur) ? '* is the month in progress. ' : ''}Months come from weekly totals split by day.</div></div>
      <div class="toolbar"><button class="btn" id="mCopy" type="button">Copy as CSV</button></div></div>
      <div class="toolbar" style="gap:14px">
        <label class="seg-label" for="mPer">Months<select id="mPer"><option value="l12">Last 12 months</option><option value="l24">Last 24 months</option>${years.map(y => `<option value="${y}">${y}</option>`).join('')}</select></label>
        <div class="seg-label">Show${seg('meas', mMeasure, [['units', 'Units'], ['egp', 'EGP']])}</div>
        <div class="seg-label">Forecast${seg('fc', mFc, [[1, '1 month'], [3, '3 months'], [6, '6 months']])}</div>
      </div></section>
    <section class="panel"><div class="panel-head"><h2>Sales by department</h2><span class="note">${mMeasure === 'egp' ? 'EGP at dealer price' : 'Units'}. Click a department to show only its SKUs below.</span></div>
      <div class="tblwrap merch"><table><thead><tr><th>Department</th>${months.map(m => `<th class="n">${ml(m)}</th>`).join('')}<th class="n tcol">Total</th><th class="n">Share</th><th class="n">Vs year before</th><th>Trend</th></tr></thead>
      <tbody>${drow.map(r => `<tr class="click-dept ${mDept === r.d ? 'on' : ''}" data-dept="${esc(r.d)}" tabindex="0"><td><b>${esc(r.d)}</b> <span class="note">${r.n} SKUs</span></td>${r.v.map(v => `<td class="n">${fmtV(v)}</td>`).join('')}
        <td class="n tcol"><b>${fmtV(r.tot)}</b></td><td class="n">${gtot ? nf(100 * r.tot / gtot) + '%' : '–'}</td><td class="n">${yoy(r.tot, r.prev)}</td><td>${spark(r.v)}</td></tr>`).join('') || `<tr><td class="empty" colspan="${months.length + 5}">Nothing in this filter.</td></tr>`}
      <tr class="grp"><td>All departments</td>${grand.map(v => `<td class="n">${fmtV(v)}</td>`).join('')}<td class="n tcol">${fmtV(gtot)}</td><td class="n">100%</td><td class="n">${yoy(gtot, gprev)}</td><td>${spark(grand)}</td></tr></tbody></table></div></section>
    <section class="panel"><div class="panel-head"><h2>${mDept ? esc(mDept) + ' SKUs' : 'All SKUs'}</h2><div class="toolbar">${mDept ? '<button class="btn small" id="mAll" type="button">Show all departments</button>' : ''}<span class="note">${rows.length} SKUs. Click a header to sort; click a SKU for its detail.</span></div></div>
      <div class="tblwrap merch"><table><thead><tr>${th('sku', 'SKU', '')}${months.map((m, j) => th('m' + j, ml(m))).join('')}${th('tot', 'Total')}${th('stock', 'Stock')}${th('fc', `Forecast ${fcLabel}`)}${th('act', 'Order or overstock')}</tr></thead>
      <tbody>${body || `<tr><td class="empty" colspan="${months.length + 5}">Nothing in this filter.</td></tr>`}</tbody></table></div>
      <p class="note">Order is this week's production or purchase quantity from the plan (your edits included). Overstock is stock beyond 120 days of forecast, or all of it for dead and long out SKUs.</p></section>`,
    after(root){
      $('#mPer', root).value = mPer; $('#mPer', root).addEventListener('change', e => { mPer = e.target.value; render(); });
      $$('[data-meas]', root).forEach(b => b.addEventListener('click', () => { mMeasure = b.dataset.meas; render(); }));
      $$('[data-fc]', root).forEach(b => b.addEventListener('click', () => { mFc = +b.dataset.fc; render(); }));
      $$('[data-dept]', root).forEach(tr => { const go = () => { mDept = mDept === tr.dataset.dept ? '' : tr.dataset.dept; render(); };
        tr.addEventListener('click', go); tr.addEventListener('keydown', e => { if (e.key === 'Enter') go(); }); });
      $('#mAll', root)?.addEventListener('click', () => { mDept = ''; render(); });
      $$('[data-mk]', root).forEach(h => { const go = () => { mSort = mSort.k === h.dataset.mk ? (mSort.d > 0 ? {k: null, d: -1} : {k: h.dataset.mk, d: 1}) : {k: h.dataset.mk, d: -1}; render(); };
        h.addEventListener('click', go); h.addEventListener('keydown', e => { if (e.key === 'Enter') go(); }); });
      $('#mCopy', root).addEventListener('click', () => {
        const head = ['department', 'line', 'sku', 'product', 'finish', 'size', ...months, 'total', 'stock', `forecast ${fcLabel}`, 'order', 'overstock'];
        const out = [head, ...rows.map(r => [r.s.dept, r.s.line, r.s.sku, r.s.p, r.s.c, r.s.z, ...r.v.map(Math.round), Math.round(r.tot), Math.round(r.stock), Math.round(r.fc), r.q > 0 ? Math.round(r.act) : 0, r.q <= 0 ? Math.round(-r.act) : 0])];
        const csv = out.map(r => r.map(v => /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : v).join(',')).join('\n');
        navigator.clipboard.writeText(csv).then(() => toast(`Copied ${rows.length} SKUs. Paste into Excel.`)).catch(() => toast('Copy was blocked by the browser.'));
      });
    }};
};

function parseCSV(text){
  text = text.replace(/^﻿/, '');
  const nl = text.indexOf('\n'), first = nl >= 0 ? text.slice(0, nl) : text;
  const delim = [',', ';', '\t'].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++){ const c = text[i];
    if (q){ if (c === '"'){ if (text[i + 1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === delim){ row.push(f); f = ''; }
    else if (c === '\n' || c === '\r'){ if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c; }
  if (f !== '' || row.length){ row.push(f); rows.push(row); }
  const head = (rows.shift() || []).map(h => h.trim());
  return rows.filter(r => r.some(x => x.trim() !== '')).map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] ?? '').trim()])));
}
let xlsxLib;
function loadXLSX(){
  return xlsxLib ||= new Promise((ok, no) => { const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; sc.onload = () => ok(window.XLSX);
    sc.onerror = () => { xlsxLib = null; no(new Error('Could not load the Excel reader. Check the internet connection, or save the sheet as CSV.')); }; document.head.appendChild(sc); });
}
async function readFile(file){
  if (/\.(xlsx|xlsm|xls)$/i.test(file.name)){
    const X = await loadXLSX(), wb = X.read(await file.arrayBuffer(), {type: 'array', cellDates: true});
    return X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval: '', raw: true});
  }
  return parseCSV(await file.text());
}
async function takeFile(k, file){
  pending[k] = {file: file.name, busy: true}; render();
  try { const rows = await readFile(file); pending[k] = {file: file.name, rows};
    if (!rows.length) pending[k].err = 'No rows found. Check the file has a header row and data.'; }
  catch (e) { pending[k] = {file: file.name, err: e.message || 'Could not read this file.'}; }
  render();
}
function useRaw(raw, info){
  D = ENGINE.build(raw); INFO = info;
  byId = Object.fromEntries(D.skus.map(s => [s.id, s]));
  const uniq = k => [...new Set(D.skus.map(s => s[k]))].sort();
  Object.keys(F).forEach(k => F[k] = ''); $('#fQ').value = ''; openLines = new Set(); openMonth = null;
  fillSelect('#fLine', 'lines', uniq('line')); fillSelect('#fSrc', 'sources', Object.keys(D.sources)); fillSelect('#fFin', 'finishes', uniq('c'));
  $('#asof').textContent = dlabel(D.asof);
  const b = $('#srcBadge'); b.textContent = info.demo ? 'Synthetic demo data, not real ASG sales' : `Your data: ${info.files.length} files, built ${info.at}`; b.classList.toggle('mine', !info.demo);
}
function demoTables(){
  const t = Object.fromEntries(Object.entries(DEMO).filter(([k]) => k !== 'weekly').map(([k, v]) => [k, unpack(v)]));
  const W = DEMO.weekly, rows = t.sales; // cancelled rows are kept as rows; shipped and lost come from weekly arrays
  W.skus.forEach((sku, j) => { for (let i = 0; i < W.dealer[j].length; i++){ const date = addDays(W.start, 7 * i);
    if (W.dealer[j][i]) rows.push({date, sku, qty: W.dealer[j][i], status: 'shipped', channel: 'dealer'});
    if (W.export[j][i]) rows.push({date, sku, qty: W.export[j][i], status: 'shipped', channel: 'export'});
    if (W.project[j][i]) rows.push({date, sku, qty: W.project[j][i], status: 'shipped', channel: 'project'});
    if (W.lost[j][i]) rows.push({date, sku, qty: W.lost[j][i], status: 'lost', channel: 'dealer'}); } });
  return t;
}
function useDemo(){ const {raw} = ENGINE.fromTables(demoTables()); useRaw(raw, {demo: true, files: []}); }
function buildFromUploads(){
  const tables = Object.fromEntries(SLOTS.map(sl => [sl.k, pending[sl.k]?.rows || null]));
  const {raw, problems} = ENGINE.fromTables(tables);
  lastProblems = problems;
  if (!raw){ render(); toast('Fix the problems listed, then build again.'); return; }
  const info = {demo: false, files: SLOTS.filter(sl => pending[sl.k]?.rows).map(sl => pending[sl.k].file), at: new Date().toISOString().slice(0, 10)};
  try { useRaw(raw, info); }
  catch (e) { lastProblems = [...problems, 'The forecast could not be built: ' + e.message]; render(); return; }
  edits = {}; saveEdits();
  try { localStorage.setItem('asg-data', JSON.stringify({raw, info})); }
  catch (e) { toast('Built. Too large to remember in this browser, so upload again next time.'); }
  toast(`Built from your files: ${D.skus.length} SKUs.`);
  show('overview');
}
function boot(){
  let saved = null; try { saved = JSON.parse(localStorage.getItem('asg-data') || 'null'); } catch (e) {}
  if (saved?.raw){ try { useRaw(saved.raw, saved.info); render(); return; } catch (e) { try { localStorage.removeItem('asg-data'); } catch (_) {} } }
  useDemo(); render();
}
